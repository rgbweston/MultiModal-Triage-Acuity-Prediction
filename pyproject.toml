[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multimodal-triage-acuity-prediction"
version = "0.1.0"
description = "Predict patient acuity levels (ESI 1-5) using multimodal deep learning with structured clinical data and text embeddings"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Rohan Barrowcliff", email = "rohan@example.com"}
]
keywords = ["machine-learning", "deep-learning", "healthcare", "triage", "multimodal", "pytorch", "nlp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "numpy>=1.24.0,<3.0.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "transformers>=4.33.0",
    "sentence-transformers>=2.2.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
]

[project.optional-dependencies]
streamlit = [
    "streamlit>=1.28.0",
    "plotly>=5.17.0",
]
dev = [
    "ipython>=8.12.0",
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.5.0",
    "isort>=5.12.0",
]
all = [
    "multimodal-triage-acuity-prediction[streamlit,dev]",
]

[project.urls]
Homepage = "https://github.com/rohanbarrowcliff/MultiModal-Triage-Acuity-Prediction"
Repository = "https://github.com/rohanbarrowcliff/MultiModal-Triage-Acuity-Prediction"
Issues = "https://github.com/rohanbarrowcliff/MultiModal-Triage-Acuity-Prediction/issues"

[tool.setuptools]
packages = ["multimodal_triage"]

[tool.setuptools.package-data]
multimodal_triage = ["*.pth", "*.pkl"]

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "--cov=multimodal_triage --cov-report=html --cov-report=term-missing"
